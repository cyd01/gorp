directory: .

listeners:
  - name: http
    type: http
    address: ":8080"
    middlewares:
      - name: correlation_id
        config:  
          type: uuidv7
      - name: logging
      - name: distributed_tracing
      - name: rate_limiter
        config:
          max_requests: 20
          window: 1s
          extensions:
            - "*.jpg"
            - "*.jpeg"
            - "*.png"

  - name: oidc
    type: http
    address: ":8888"

  - name: test-api
    type: mocksrv
    address: ":8070"
    middlewares:
      - name: logging
    mocksrv:
      routes:
        users:
          match:
            method: GET
            path: /users/123456
          scenarios:
            found:
              status: 200
              headers:
                Content-Type: application/json
              body: '{"id": 123456, "name", "found"}'
            not-found:
              status: 404
              headers:
                Content-Type: application/json
              body: '{"result":"not found"}'
        users-dynamic:
          match:
            method: GET
            path: /users/:id
          default:
            code: |
              package dynamic
              import (
                "bytes"
                "encoding/json"
                "io"
                "net/http"
                "time"
              )
              func Middleware(response *http.Response) error {
                id := response.Request.PathValue("id")
                response.StatusCode = http.StatusOK
                response.Header.Set("Content-Type", "application/json")
                body, err := json.Marshal(map[string]string{
                    "id": id,
                    "firstname": "John",
                    "lastname": "Doe",
                    "Date": time.Now().Format(time.RFC3339),
                })
                if err != nil {
                    return err
                }
                response.Body = io.NopCloser(bytes.NewReader(body))
                return nil
              }

  - name: https
    type: https
    address: ":1443"
    tls:
      cert_file: server.crt
      key_file: server.key

  - name: http3
    type: http3
    address: ":8443"
    tls:
      cert_file: server.crt
      key_file: server.key

  - name: multi
    type: multi
    address: ":1444"
    tls:
      cert_file: server-ec.crt
      key_file: server-ec.key

  - name: dynamic-https
    type: dynamic
    address: ":1445"
    tls:
      cert_file: ca.crt
      key_file: ca.key
      #key_passphrase: "change-me"
      #ca_file: ca.crt


  - name: proxy
    type: proxy
    address: ":3128"
    log: true
    proxy:
      url: http://proxy.piratemind.com:8080
