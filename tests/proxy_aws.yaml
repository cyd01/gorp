# Example: AWS S3 Backend Configuration

# Configuration example pour proxifier un backend AWS S3 avec authentification AWS Signature Version 4

routes:
  - name: s3-bucket
    prefix: "/s3"
    strip_prefix: true
    backends:
      - name: aws_s3_backend
        url: "https://my-bucket.s3.us-east-1.amazonaws.com"
        timeout: 30
        auth:
          type: "aws"                           # Use AWS Signature Version 4
          access_key_id: "AKIAIOSFODNN7EXAMPLE"
          secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          region: "us-east-1"                   # AWS region
          service: "s3"                         # AWS service (s3, ec2, etc.)

  # Alternative: EC2 or other AWS service
  - name: aws-service
    prefix: "/ec2"
    strip_prefix: true
    backends:
      - name: aws_ec2_backend
        url: "https://ec2.us-west-2.amazonaws.com"
        timeout: 30
        auth:
          type: "aws"
          access_key_id: "YOUR_ACCESS_KEY_ID"
          secret_access_key: "YOUR_SECRET_ACCESS_KEY"
          region: "us-west-2"
          service: "ec2"

# Notes:
# - AWS Signature Version 4 signs each request with:
#   * Authorization header containing credentials and signature
#   * X-Amz-Date header (current timestamp in UTC)
#   * X-Amz-Content-Sha256 header (SHA256 hash of request body)
#
# - The signature includes:
#   * All request headers
#   * Request method and path
#   * Query parameters
#   * Request body hash
#
# - Supported AWS services: s3, ec2, elasticloadbalancing, dynamodb, lambda, etc.
#
# - For S3, the URL format can be:
#   * Virtual-hosted style: https://bucket-name.s3.region.amazonaws.com
#   * Path-style: https://s3.region.amazonaws.com/bucket-name
#   * S3 Transfer Acceleration: https://bucket-name.s3-accelerate.amazonaws.com
#
# Security best practices:
# - Store credentials securely (environment variables, AWS credentials file)
# - Rotate access keys regularly
# - Use IAM roles and temporary credentials when possible
# - Restrict IAM policy to minimal required permissions
