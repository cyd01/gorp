admin:
  enabled: true
  address: ":9090"
  # /health, /ready, /config, /stop admin endpoints

directory: .

listeners:
  # Simple HTTP, with log middlewares
  - name: http
    type: http
    address: ":8080"
    middlewares:
      - name: correlation_id
      - name: logging

  # HTTPS with log middlewares
  - name: https
    type: https
    address: ":1443"
    tls:
      cert_file: server.crt
      key_file: server.key
    middlewares:
      - name: correlation_id
      - name: logging

  # HTTPS with mTLS (client authentication) and revokation list (CRL)
  - name: https_with_mtls
    type: https
    address: ":1444"
    tls:
      cert_file: server.crt
      key_file: server.key
      ca_file: ca.crt
      crl_file: ca.crl

  # HTTP3
  - name: http3
    type: http3
    address: ":8443"
    tls:
      cert_file: server.crt
      key_file: server.key
    middlewares:
      - name: basic_auth
        config:
          realm: "Restricted"
          users:
            alice: secret
            bob: password
      #- name: token_auth
      #  config:
      #    realm: "API"
      #    tokens:
      #      - "token1"
      #      - "token2"
      #- name: digest_auth
      #  config:
      #    realm: "Digest"
      #    nonce_timeout: 5m
      #    users:
      #      alice: secret123

  # TCP sans TLS
  - name: tcp_plain
    type: tcp
    address: ":9000"
    backends:
      - name: backend1
        url: "localhost:8080"
        timeout: 30

  # TCP avec TLS
  - name: tcp_secure
    type: tcp
    address: ":9443"
    tls:
      cert_file: server.crt
      key_file: server.key
    backends:
      - name: backend1
        url: "localhost:9001"
        timeout: 30

routes:
  - name: echo
    prefix: "/echo"
    strip_prefix: true
    # Selector à appliquer
    selector:
      type: RoundRobin
    # Middleware à appliquer
    middlewares:
      - name: delay
        config:
          duration: 1000ms
    backends:
      - name: echo_backend
        url: "http://localhost:8080"
        timeout: 10

  - name: echo_backend_basic
    prefix: "/backend-basic"
    strip_prefix: true
    backends:
      - name: basic_backend
        url: "http://localhost:8080"
        timeout: 10
        auth:
          type: basic
          username: "alice"
          password: "secret"

  - name: echo_backend_token
    prefix: "/backend-token"
    strip_prefix: true
    backends:
      - name: token_backend
        url: "http://localhost:8080"
        timeout: 10
        auth:
          type: token
          token: "token1"
          header: "Authorization"
          prefix: "Bearer "

  - name: echo_with_proxy
    prefix: "/echoproxy"
    strip_prefix: true
    backends:
      - name: proxied_backend
        url: "https://localhost:8080"
        timeout: 10
        # proxy:
        #   url: "http://127.0.0.1:3128"
        #   username: "user"
        #   password: "secret"

  - name: echo_with_tls
    prefix: "/echotls"
    strip_prefix: true
    backends:
      - name: echotls_backend
        url: "https://localhost:1443"
        timeout: 10

  - name: echo_openid
    prefix: "/openid"
    strip_prefix: true
    middlewares:
      - name: auth_openid
        config:
          issuer: "https://issuer.example.com"
          audience: "api://default"
          algorithm: "RS256"
          keys:
